<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Semáforo de Ayuno - Plan 3MAD</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans antialiased overflow-hidden select-none h-screen w-screen flex flex-col items-center justify-center relative p-4 sm:p-6 transition-all duration-1000" id="main-bg">

  <!-- PANTALLA DE INICIO (Obligatoria para desbloquear el audio en iOS/Android) -->
  <div id="audio-unlock-overlay" class="fixed inset-0 z-[100] bg-zinc-950 flex flex-col items-center justify-center cursor-pointer">
    <div class="w-24 h-24 bg-zinc-900 rounded-full flex items-center justify-center mb-6 animate-pulse shadow-[0_0_50px_rgba(255,255,255,0.1)]">
      <span class="text-5xl">🔊</span>
    </div>
    <h2 class="text-2xl font-bold text-white mb-2">Toca para Iniciar</h2>
    <p class="text-zinc-500 text-sm text-center max-w-xs">Necesario para autorizar el audio en este dispositivo.</p>
  </div>

  <!-- AUDIOS VINCULADOS (DEBES TENER ESTOS ARCHIVOS EN TU CARPETA) -->
  <audio id="audio-rooster" src="gallo.mp3" preload="auto"></audio>
  <audio id="audio-chicken" src="gallina.mp3" preload="auto"></audio>

  <!-- BARRA SUPERIOR DE BOTONES (Flotante arriba, se oculta al maximizar) -->
  <div id="top-bar" class="absolute top-4 sm:top-6 left-4 right-4 max-w-sm mx-auto flex justify-between items-center z-20 transition-opacity duration-300">
    <button id="btn-settings" class="p-3 rounded-full bg-zinc-900/80 backdrop-blur border border-zinc-800 shadow-lg active:scale-95 transition-all">
      <svg class="w-6 h-6 text-zinc-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>
    <button id="btn-list" class="p-3 rounded-full bg-zinc-900/80 backdrop-blur border border-zinc-800 shadow-lg active:scale-95 transition-all">
      <svg class="w-6 h-6 text-zinc-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
    </button>
    <button id="btn-fullscreen" class="p-3 rounded-full bg-zinc-900/80 backdrop-blur border border-zinc-800 shadow-lg active:scale-95 transition-all">
      <svg class="w-6 h-6 text-zinc-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
      </svg>
    </button>
  </div>

  <!-- EMOJIS (A medio camino entre la parte superior y la parte alta del semáforo) -->
  <div class="absolute top-16 sm:top-20 left-0 right-0 flex justify-center z-20">
    <span id="emoji-display" class="text-2xl sm:text-3xl tracking-widest transition-all">🐔🔒</span>
  </div>

  <!-- SEMÁFORO VERTICAL (EXACTAMENTE EN EL CENTRO DE LA PANTALLA) -->
  <div class="flex flex-col items-center justify-center my-auto z-10">
    <div class="w-40 sm:w-48 bg-zinc-950 p-4 sm:p-5 rounded-[3rem] border-4 border-zinc-900 shadow-2xl flex flex-col items-center space-y-4 sm:space-y-6">
      <!-- FOCO ROJO -->
      <div id="red-bulb" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700"></div>
      <!-- FOCO AMARILLO -->
      <div id="yellow-bulb" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700"></div>
      <!-- FOCO VERDE -->
      <div id="green-bulb" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700"></div>
    </div>
  </div>

  <!-- TEMPORIZADOR COMPACTO (A medio camino entre la parte baja del semáforo y la parte más baja de la pantalla) -->
  <div class="absolute bottom-16 sm:bottom-20 left-0 right-0 flex justify-center z-20">
    <div class="bg-zinc-950 border border-zinc-900/90 backdrop-blur-md px-3.5 py-1 rounded-full shadow-xl flex items-center justify-center">
      <span id="timer-display" class="font-mono text-sm sm:text-base font-bold tracking-wider text-zinc-300">00:00:00</span>
    </div>
  </div>

  <!-- MODAL DE CONFIGURACIÓN DE HORARIOS -->
  <div id="modal-settings" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-950 border border-zinc-900 rounded-3xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-white">Configurar Comidas</h2>
        <button id="close-settings" class="p-2 text-zinc-400 hover:text-white">✕</button>
      </div>

      <div id="meals-container" class="flex-1 overflow-y-auto space-y-4 pr-1"></div>

      <!-- BOTONES PARA PROBAR EL AUDIO -->
      <div class="mt-4 p-3 bg-zinc-900 rounded-xl border border-zinc-800">
        <label class="text-zinc-400 text-xs block mb-2 font-bold uppercase tracking-wider">Prueba de Sonido</label>
        <div class="flex space-x-2">
          <button id="btn-test-rooster" class="flex-1 py-2 bg-emerald-950/50 border border-emerald-900 text-emerald-400 rounded-lg text-sm hover:bg-emerald-900 transition-colors">🐓 Probar Gallo</button>
          <button id="btn-test-chicken" class="flex-1 py-2 bg-rose-950/50 border border-rose-900 text-rose-400 rounded-lg text-sm hover:bg-rose-900 transition-colors">🐔 Probar Gallina</button>
        </div>
      </div>

      <div class="mt-4 space-y-3">
        <button id="btn-add-meal" class="w-full py-3 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 font-bold rounded-xl text-sm border border-zinc-800">
          + Añadir Comida
        </button>
        <button id="btn-save-settings" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-950">
          Guardar y Cerrar
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE VER PROGRAMA -->
  <div id="modal-list" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-950 border border-zinc-900 rounded-3xl w-full max-w-sm p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-white">Programa de Comidas</h2>
        <button id="close-list" class="p-2 text-zinc-400 hover:text-white">✕</button>
      </div>
      <div id="program-list" class="space-y-3 mb-6"></div>
      <button id="btn-close-program" class="w-full py-3 bg-zinc-900 text-zinc-300 font-bold rounded-xl">Cerrar</button>
    </div>
  </div>

  <!-- SCRIPT LÓGICA VANILLA JS -->
  <script>
    const ALL_DAYS = [1, 2, 3, 4, 5, 6, 0]; // 1=Lunes ... 0=Domingo
    const DAYS_MAP = [
      { d: 1, l: 'L' }, { d: 2, l: 'M' }, { d: 3, l: 'X' },
      { d: 4, l: 'J' }, { d: 5, l: 'V' }, { d: 6, l: 'S' }, { d: 0, l: 'D' }
    ];

    const defaultMeals = [
      { id: '1', name: 'Desayuno', start: '09:00', end: '09:45', days: [...ALL_DAYS] },
      { id: '2', name: 'Almuerzo', start: '14:00', end: '15:00', days: [...ALL_DAYS] },
      { id: '3', name: 'Cena', start: '20:00', end: '21:00', days: [...ALL_DAYS] }
    ];

    let meals = JSON.parse(localStorage.getItem('plan3mad_meal_slots')) || defaultMeals;

    meals = meals.map(m => ({
      ...m,
      days: Array.isArray(m.days) && m.days.length > 0 ? m.days : [...ALL_DAYS]
    }));

    const mainBg = document.getElementById('main-bg');
    const topBar = document.getElementById('top-bar');
    const emojiDisplay = document.getElementById('emoji-display');
    const redBulb = document.getElementById('red-bulb');
    const yellowBulb = document.getElementById('yellow-bulb');
    const greenBulb = document.getElementById('green-bulb');
    const timerDisplay = document.getElementById('timer-display');
    
    // Audios
    const audioRooster = document.getElementById('audio-rooster');
    const audioChicken = document.getElementById('audio-chicken');
    const overlay = document.getElementById('audio-unlock
