<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Semáforo de Ayuno - Plan 3MAD</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SettingsIcon = () => (
      <svg className="w-6 h-6 text-slate-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    );

    const MaximizeIcon = () => (
      <svg className="w-6 h-6 text-slate-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
      </svg>
    );

    const ListIcon = () => (
      <svg className="w-6 h-6 text-slate-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
    );

    const XIcon = () => (
      <svg className="w-6 h-6 text-slate-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const defaultMeals = [
      { id: '1', name: 'Desayuno', start: '09:00', end: '09:45' },
      { id: '2', name: 'Almuerzo', start: '14:00', end: '15:00' },
      { id: '3', name: 'Cena', start: '20:00', end: '21:00' }
    ];

    function App() {
      const [meals, setMeals] = useState(() => {
        const saved = localStorage.getItem('plan3mad_meal_slots');
        return saved ? JSON.parse(saved) : defaultMeals;
      });

      const [showSettings, setShowSettings] = useState(false);
      const [showList, setShowList] = useState(false);
      const [status, setStatus] = useState('FASTING');
      const [timeRemaining, setTimeRemaining] = useState('00:00:00');

      useEffect(() => {
        localStorage.setItem('plan3mad_meal_slots', JSON.stringify(meals));
      }, [meals]);

      useEffect(() => {
        if ('wakeLock' in navigator) {
          navigator.wakeLock.request('screen').catch(() => {});
        }
      }, []);

      useEffect(() => {
        const updateTimer = () => {
          const now = new Date();
          const currentMinutes = now.getHours() * 60 + now.getMinutes();
          const currentSeconds = now.getSeconds();

          let activeMeal = null;
          let minMinutesToNext = Infinity;

          meals.forEach(meal => {
            const [sH, sM] = meal.start.split(':').map(Number);
            const [eH, eM] = meal.end.split(':').map(Number);
            const startMins = sH * 60 + sM;
            const endMins = eH * 60 + eM;

            if (currentMinutes >= startMins && currentMinutes < endMins) {
              activeMeal = { ...meal, endMins };
            }

            let diff = startMins - currentMinutes;
            if (diff <= 0) diff += 1440;
            if (diff < minMinutesToNext) {
              minMinutesToNext = diff;
            }
          });

          if (activeMeal) {
            setStatus('EATING');
            const remainingSecs = (activeMeal.endMins - currentMinutes) * 60 - currentSeconds;
            setTimeRemaining(formatSeconds(remainingSecs));
          } else {
            setStatus('FASTING');
            const totalSecs = minMinutesToNext * 60 - currentSeconds;
            setTimeRemaining(formatSeconds(totalSecs));
          }
        };

        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, [meals]);

      const formatSeconds = (totalSecs) => {
        if (totalSecs < 0) return '00:00:00';
        const h = Math.floor(totalSecs / 3600);
        const m = Math.floor((totalSecs % 3600) / 60);
        const s = totalSecs % 60;
        return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
      };

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      };

      const handleMealChange = (index, field, value) => {
        const updated = [...meals];
        updated[index][field] = value;
        setMeals(updated);
      };

      const addMeal = () => {
        setMeals([...meals, { id: Date.now().toString(), name: 'Nueva Comida', start: '12:00', end: '13:00' }]);
      };

      const removeMeal = (index) => {
        setMeals(meals.filter((_, i) => i !== index));
      };

      const isGreen = status === 'EATING';

      return (
        <div className={`h-screen w-screen flex flex-col items-center justify-between p-6 transition-colors duration-1000 ${
          isGreen ? 'bg-emerald-950/40' : 'bg-rose-950/40'
        }`}>
          
          <div className="w-full max-w-sm flex justify-between items-center z-10">
            <button onClick={() => setShowSettings(true)} className="p-3 rounded-full bg-slate-900/60 backdrop-blur border border-slate-800 shadow-lg active:scale-95 transition-all">
              <SettingsIcon />
            </button>
            <button onClick={() => setShowList(true)} className="p-3 rounded-full bg-slate-900/60 backdrop-blur border border-slate-800 shadow-lg active:scale-95 transition-all">
              <ListIcon />
            </button>
            <button onClick={toggleFullscreen} className="p-3 rounded-full bg-slate-900/60 backdrop-blur border border-slate-800 shadow-lg active:scale-95 transition-all">
              <MaximizeIcon />
            </button>
          </div>

          <div className="flex-1 flex flex-col items-center justify-center my-4">
            <div className="w-48 sm:w-56 bg-slate-900/90 p-6 rounded-full border-4 border-slate-800 shadow-2xl flex flex-col items-center space-y-8">
              <div className={`w-36 h-36 sm:w-44 sm:h-44 rounded-full transition-all duration-700 ${
                !isGreen 
                  ? 'bg-rose-500 shadow-[0_0_80px_rgba(244,63,94,0.9)] scale-105' 
                  : 'bg-rose-950/40 opacity-20 border border-rose-900/30'
              }`} />

              <div className={`w-36 h-36 sm:w-44 sm:h-44 rounded-full transition-all duration-700 ${
                isGreen 
                  ? 'bg-emerald-500 shadow-[0_0_80px_rgba(16,185,129,0.9)] scale-105' 
                  : 'bg-emerald-950/40 opacity-20 border border-emerald-900/30'
              }`} />
            </div>
          </div>

          <div className="z-10 mb-2">
            <div className="bg-slate-900/80 border border-slate-800/80 backdrop-blur-md px-6 py-2.5 rounded-full shadow-2xl flex items-center justify-center">
              <span className="font-mono text-2xl font-bold tracking-wider text-slate-200">
                {timeRemaining}
              </span>
            </div>
          </div>

          {showSettings && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold text-white">Horarios de Comidas</h2>
                  <button onClick={() => setShowSettings(false)} className="p-2 text-slate-400 hover:text-white">
                    <XIcon />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-4 pr-1">
                  {meals.map((meal, index) => (
                    <div key={meal.id} className="bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50 space-y-3">
                      <div className="flex justify-between items-center">
                        <input
                          type="text"
                          value={meal.name}
                          onChange={(e) => handleMealChange(index, 'name', e.target.value)}
                          className="bg-transparent font-semibold text-white focus:outline-none border-b border-transparent focus:border-emerald-500"
                        />
                        {
