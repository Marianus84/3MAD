<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Semáforo de Ayuno - Plan 3MAD</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans antialiased overflow-hidden select-none h-screen w-screen flex flex-col items-center p-4 sm:p-6" id="main-bg">

  <!-- BARRA SUPERIOR DE BOTONES (Se oculta al maximizar) -->
  <div id="top-bar" class="w-full max-w-sm flex justify-between items-center z-10 transition-opacity duration-300">
    <button id="btn-settings" class="p-3 rounded-full bg-zinc-900/80 backdrop-blur border border-zinc-800 shadow-lg active:scale-95 transition-all">
      <svg class="w-6 h-6 text-zinc-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
    </button>
    <button id="btn-list" class="p-3 rounded-full bg-zinc-900/80 backdrop-blur border border-zinc-800 shadow-lg active:scale-95 transition-all">
      <svg class="w-6 h-6 text-zinc-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
      </svg>
    </button>
    <button id="btn-fullscreen" class="p-3 rounded-full bg-zinc-900/80 backdrop-blur border border-zinc-800 shadow-lg active:scale-95 transition-all">
      <svg class="w-6 h-6 text-zinc-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
      </svg>
    </button>
  </div>

  <!-- SEMÁFORO VERTICAL TAMAÑO COMPLETO -->
  <div class="flex-[3] flex flex-col items-center justify-center my-auto">
    <div class="w-40 sm:w-48 bg-zinc-950 p-4 sm:p-5 rounded-[3rem] border-4 border-zinc-900 shadow-2xl flex flex-col items-center space-y-4 sm:space-y-6">
      <!-- FOCO ROJO -->
      <div id="red-bulb" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700"></div>
      <!-- FOCO AMARILLO -->
      <div id="yellow-bulb" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700"></div>
      <!-- FOCO VERDE -->
      <div id="green-bulb" class="w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700"></div>
    </div>
  </div>

  <!-- TEMPORIZADOR A MITAD DE CAMINO ENTRE EL SEMÁFORO Y EL FINAL DE LA PANTALLA -->
  <div class="flex-1 flex items-center justify-center z-10 w-full">
    <div class="bg-zinc-950 border border-zinc-900/90 backdrop-blur-md px-3.5 py-1 rounded-full shadow-xl flex items-center justify-center">
      <span id="timer-display" class="font-mono text-sm sm:text-base font-bold tracking-wider text-zinc-300">00:00:00</span>
    </div>
  </div>

  <!-- MODAL DE CONFIGURACIÓN DE HORARIOS -->
  <div id="modal-settings" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-950 border border-zinc-900 rounded-3xl w-full max-w-md p-6 shadow-2xl max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-white">Configurar Comidas</h2>
        <button id="close-settings" class="p-2 text-zinc-400 hover:text-white">✕</button>
      </div>

      <div id="meals-container" class="flex-1 overflow-y-auto space-y-4 pr-1"></div>

      <div class="mt-6 space-y-3">
        <button id="btn-add-meal" class="w-full py-3 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 font-bold rounded-xl text-sm border border-zinc-800">
          + Añadir Comida
        </button>
        <button id="btn-save-settings" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-950">
          Guardar y Cerrar
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE VER PROGRAMA -->
  <div id="modal-list" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-zinc-950 border border-zinc-900 rounded-3xl w-full max-w-sm p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-white">Programa de Comidas</h2>
        <button id="close-list" class="p-2 text-zinc-400 hover:text-white">✕</button>
      </div>
      <div id="program-list" class="space-y-3 mb-6"></div>
      <button id="btn-close-program" class="w-full py-3 bg-zinc-900 text-zinc-300 font-bold rounded-xl">Cerrar</button>
    </div>
  </div>

  <!-- SCRIPT LÓGICA VANILLA JS -->
  <script>
    const ALL_DAYS = [1, 2, 3, 4, 5, 6, 0]; // 1=Lunes ... 0=Domingo
    const DAYS_MAP = [
      { d: 1, l: 'L' }, { d: 2, l: 'M' }, { d: 3, l: 'X' },
      { d: 4, l: 'J' }, { d: 5, l: 'V' }, { d: 6, l: 'S' }, { d: 0, l: 'D' }
    ];

    const defaultMeals = [
      { id: '1', name: 'Desayuno', start: '09:00', end: '09:45', days: [...ALL_DAYS] },
      { id: '2', name: 'Almuerzo', start: '14:00', end: '15:00', days: [...ALL_DAYS] },
      { id: '3', name: 'Cena', start: '20:00', end: '21:00', days: [...ALL_DAYS] }
    ];

    let meals = JSON.parse(localStorage.getItem('plan3mad_meal_slots')) || defaultMeals;

    meals = meals.map(m => ({
      ...m,
      days: Array.isArray(m.days) && m.days.length > 0 ? m.days : [...ALL_DAYS]
    }));

    const topBar = document.getElementById('top-bar');
    const redBulb = document.getElementById('red-bulb');
    const yellowBulb = document.getElementById('yellow-bulb');
    const greenBulb = document.getElementById('green-bulb');
    const timerDisplay = document.getElementById('timer-display');

    const modalSettings = document.getElementById('modal-settings');
    const modalList = document.getElementById('modal-list');
    const mealsContainer = document.getElementById('meals-container');
    const programList = document.getElementById('program-list');

    // MANTENER PANTALLA ENCENDIDA
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }

    function saveMeals() {
      localStorage.setItem('plan3mad_meal_slots', JSON.stringify(meals));
    }

    function getMealDays(meal) {
      return Array.isArray(meal.days) && meal.days.length > 0 ? meal.days : ALL_DAYS;
    }

    function formatSeconds(totalSecs) {
      if (totalSecs < 0) return '00:00:00';
      const h = Math.floor(totalSecs / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = totalSecs % 60;
      return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function getFirstMealOfNextDayTimestamp() {
      const now = new Date();
      for (let offset = 1; offset <= 7; offset++) {
        const checkDate = new Date(now);
        checkDate.setDate(now.getDate() + offset);
        const checkDay = checkDate.getDay();

        const dayMeals = meals.filter(m => getMealDays(m).includes(checkDay));
        if (dayMeals.length > 0) {
          dayMeals.sort((a, b) => {
            const [aH, aM] = a.start.split(':').map(Number);
            const [bH, bM] = b.start.split(':').map(Number);
            return (aH * 60 + aM) - (bH * 60 + bM);
          });

          const firstMeal = dayMeals[0];
          const [fH, fM] = firstMeal.start.split(':').map(Number);
          checkDate.setHours(fH, fM, 0, 0);
          return checkDate.getTime();
        }
      }
      return now.getTime() + 24 * 3600 * 1000;
    }

    // Estilos de focos encendidos y apagados (Tamaño Grande)
    const BULB_OFF_RED = 'w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700 bg-rose-950/20 opacity-20 border border-rose-900/20';
    const BULB_OFF_YELLOW = 'w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700 bg-amber-950/20 opacity-20 border border-amber-900/20';
    const BULB_OFF_GREEN = 'w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700 bg-emerald-950/20 opacity-20 border border-emerald-900/20';

    const BULB_ON_RED = 'w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700 bg-rose-500 shadow-[0_0_90px_rgba(244,63,94,0.9)] scale-105';
    const BULB_ON_YELLOW = 'w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700 bg-amber-400 shadow-[0_0_90px_rgba(251,191,36,0.9)] scale-105';
    const BULB_ON_GREEN = 'w-28 h-28 sm:w-32 sm:h-32 rounded-full transition-all duration-700 bg-emerald-500 shadow-[0_0_90px_rgba(16,185,129,0.9)] scale-105';

    function updateApp() {
      const now = new Date();
      const currentMs = now.getTime();
      const forcedFastUntil = localStorage.getItem('plan3mad_forced_fast_until');

      // AYUNO FORZADO (PULSACIÓN DE 3 SEGUNDOS)
      if (forcedFastUntil && currentMs < parseInt(forcedFastUntil)) {
        redBulb.className = BULB_ON_RED;
        yellowBulb.className = BULB_OFF_YELLOW;
        greenBulb.className = BULB_OFF_GREEN;

        const totalSecs = Math.floor((parseInt(forcedFastUntil) - currentMs) / 1000);
        timerDisplay.textContent = formatSeconds(totalSecs);
        return;
      } else if (forcedFastUntil) {
        localStorage.removeItem('plan3mad_forced_fast_until');
      }

      const currentDay = now.getDay();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const currentSeconds = now.getSeconds();

      let activeMeal = null;
      let minMinutesToNext = Infinity;

      meals.forEach(meal => {
        const mealDays = getMealDays(meal);
        const [sH, sM] = meal.start.split(':').map(Number);
        const [eH, eM] = meal.end.split(':').map(Number);
        const startMins = sH * 60 + sM;
        const endMins = eH * 60 + eM;

        if (mealDays.includes(currentDay) && currentMinutes >= startMins && currentMinutes < endMins) {
          activeMeal = { ...meal, endMins };
        }

        for (let offset = 0; offset < 7; offset++) {
          const checkDay = (currentDay + offset) % 7;
          if (mealDays.includes(checkDay)) {
            let diff = (offset * 1440) + startMins - currentMinutes;
            if (diff > 0) {
              if (diff < minMinutesToNext) {
                minMinutesToNext = diff;
              }
              break;
            }
          }
        }
      });

      if (activeMeal) {
        const remainingSecs = (activeMeal.endMins - currentMinutes) * 60 - currentSeconds;
        timerDisplay.textContent = formatSeconds(remainingSecs);

        if (remainingSecs <= 900) { // Quedan 15 min o menos (900 segundos)
          // MODO AMARILLO
          redBulb.className = BULB_OFF_RED;
          yellowBulb.className = BULB_ON_YELLOW;
          greenBulb.className = BULB_OFF_GREEN;
        } else {
          // MODO VERDE
          redBulb.className = BULB_OFF_RED;
          yellowBulb.className = BULB_OFF_YELLOW;
          greenBulb.className = BULB_ON_GREEN;
        }
      } else {
        // MODO AYUNO (ROJO)
        redBulb.className = BULB_ON_RED;
        yellowBulb.className = BULB_OFF_YELLOW;
        greenBulb.className = BULB_OFF_GREEN;

        const totalSecs = (minMinutesToNext === Infinity ? 0 : minMinutesToNext * 60) - currentSeconds;
        timerDisplay.textContent = formatSeconds(totalSecs);
      }
    }

    function renderSettings() {
      mealsContainer.innerHTML = '';
      meals.forEach((meal, index) => {
        const mDays = getMealDays(meal);

        const daysButtonsHtml = DAYS_MAP.map(dayObj => {
          const isActive = mDays.includes(dayObj.d);
          const bgClass = isActive 
            ? 'bg-emerald-600 text-white font-bold border-emerald-500' 
            : 'bg-black text-zinc-600 border-zinc-800 hover:text-zinc-400';
          return `
            <button 
              type="button" 
              data-meal-index="${index}" 
              data-day="${dayObj.d}" 
              class="btn-day-toggle w-8 h-8 text-xs rounded-xl border transition-all ${bgClass}">
              ${dayObj.l}
            </button>
          `;
        }).join('');

        const item = document.createElement('div');
        item.className = 'bg-zinc-900/80 p-4 rounded-2xl border border-zinc-800 space-y-3';
        item.innerHTML = `
          <div class="flex justify-between items-center">
            <input type="text" value="${meal.name}" data-index="${index}" class="meal-name-input bg-transparent font-semibold text-white focus:outline-none border-b border-transparent focus:border-emerald-500" />
            ${meals.length > 1 ? `<button data-index="${index}" class="btn-delete-meal text-rose-400 text-xs font-bold hover:text-rose-300">Eliminar</button>` : ''}
          </div>
          
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div>
              <label class="text-zinc-400 text-xs block mb-1">Inicio</label>
              <input type="time" value="${meal.start}" data-index="${index}" class="meal-start-input w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white font-mono" />
            </div>
            <div>
              <label class="text-zinc-400 text-xs block mb-1">Fin</label>
              <input type="time" value="${meal.end}" data-index="${index}" class="meal-end-input w-full bg-black border border-zinc-800 rounded-xl px-3 py-2 text-white font-mono" />
            </div>
          </div>

          <div>
            <label class="text-zinc-400 text-xs block mb-1.5">Días aplicables</label>
            <div class="flex justify-between items-center">
              ${daysButtonsHtml}
            </div>
          </div>
        `;
        mealsContainer.appendChild(item);
      });

      document.querySelectorAll('.meal-name-input').forEach(input => {
        input.onchange = (e) => meals[e.target.dataset.index].name = e.target.value;
      });
      document.querySelectorAll('.meal-start-input').forEach(input => {
        input.onchange = (e) => meals[e.target.dataset.index].start = e.target.value;
      });
      document.querySelectorAll('.meal-end-input').forEach(input => {
        input.onchange = (e) => meals[e.target.dataset.index].end = e.target.value;
      });

      document.querySelectorAll('.btn-day-toggle').forEach(btn => {
        btn.onclick = () => {
          const mealIdx = parseInt(btn.dataset.mealIndex);
          const dayNum = parseInt(btn.dataset.day);
          let mDays = [...getMealDays(meals[mealIdx])];

          if (mDays.includes(dayNum)) {
            if (mDays.length > 1) {
              mDays = mDays.filter(d => d !== dayNum);
            }
          } else {
            mDays.push(dayNum);
          }

          meals[mealIdx].days = mDays;
          renderSettings();
        };
      });

      document.querySelectorAll('.btn-delete-meal').forEach(btn => {
        btn.onclick = (e) => {
          meals.splice(e.target.dataset.index, 1);
          renderSettings();
        };
      });
    }

    function renderProgram() {
      programList.innerHTML = '';
      meals.forEach(m => {
        const mDays = getMealDays(m);
        const daysChips = DAYS_MAP.map(dObj => {
          const active = mDays.includes(dObj.d);
          return `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${active ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'text-zinc-700'}">${dObj.l}</span>`;
        }).join(' ');

        const item = document.createElement('div');
        item.className = 'p-3 bg-zinc-900/80 rounded-xl border border-zinc-800 space-y-2';
        item.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="font-medium text-zinc-200">${m.name}</span>
            <span class="font-mono text-xs text-emerald-400 font-bold">${m.start} - ${m.end}</span>
          </div>
          <div class="flex space-x-1 pt-1 border-t border-zinc-800/60">
            ${daysChips}
          </div>
        `;
        programList.appendChild(item);
      });
    }

    // GESTO DE MANTENER PULSADO 3 SEGUNDOS EN CUALQUIER PARTE DE LA PANTALLA
    let holdTimer = null;
    let wasHoldTriggered = false;

    function startHold(e) {
      if (e.target.closest('#modal-settings') || e.target.closest('#modal-list') || e.target.closest('#top-bar')) return;
      wasHoldTriggered = false;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        wasHoldTriggered = true;
        const existingForced = localStorage.getItem('plan3mad_forced_fast_until');
        if (existingForced && parseInt(existingForced) > Date.now()) {
          localStorage.removeItem('plan3mad_forced_fast_until');
        } else {
          const targetTs = getFirstMealOfNextDayTimestamp();
          localStorage.setItem('plan3mad_forced_fast_until', targetTs);
        }
        if (navigator.vibrate) navigator.vibrate(200);
        updateApp();
      }, 3000);
    }

    function cancelHold() {
      clearTimeout(holdTimer);
    }

    document.addEventListener('mousedown', startHold);
    document.addEventListener('mouseup', cancelHold);
    document.addEventListener('mouseleave', cancelHold);
    document.addEventListener('touchstart', startHold, { passive: true });
    document.addEventListener('touchend', cancelHold);
    document.addEventListener('touchcancel', cancelHold);

    // EVENTOS Y PANTALLA COMPLETA
    document.getElementById('btn-settings').onclick = () => {
      renderSettings();
      modalSettings.classList.remove('hidden');
    };
    document.getElementById('close-settings').onclick = () => modalSettings.classList.add('hidden');
    document.getElementById('btn-save-settings').onclick = () => {
      saveMeals();
      modalSettings.classList.add('hidden');
      updateApp();
    };

    document.getElementById('btn-add-meal').onclick = () => {
      meals.push({ id: Date.now().toString(), name: 'Nueva Comida', start: '12:00', end: '13:00', days: [...ALL_DAYS] });
      renderSettings();
    };

    document.getElementById('btn-list').onclick = () => {
      renderProgram();
      modalList.classList.remove('hidden');
    };
    document.getElementById('close-list').onclick = () => modalList.classList.add('hidden');
    document.getElementById('btn-close-program').onclick = () => modalList.classList.add('hidden');

    // MODO MAXIMIZAR (Oculta botones superiores al estar en pantalla completa)
    document.getElementById('btn-fullscreen').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    };

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        topBar.classList.add('hidden');
      } else {
        topBar.classList.remove('hidden');
      }
    });

    // Tocar la pantalla en modo maximizado para salir de pantalla completa (evitando salir si fue la pulsación de 3s)
    document.body.addEventListener('click', (e) => {
      if (wasHoldTriggered) {
        wasHoldTriggered = false;
        return;
      }
      if (document.fullscreenElement && !e.target.closest('#modal-settings') && !e.target.closest('#modal-list') && !e.target.closest('#top-bar')) {
        document.exitFullscreen().catch(() => {});
      }
    });

    setInterval(updateApp, 1000);
    updateApp();
  </script>
</body>
</html>
