.top{position:absolute;left:7%;right:7%;top:7%;text-shadow:0 1px 5px #000;}
.brand{font-size:clamp(22px,6vw,34px);font-weight:550;letter-spacing:-.5px}
.view-date{font-size:12px;color:#aaa8b3;letter-spacing:.3px;margin-bottom:5px;text-shadow:0 1px 5px #000}
.total{font-size:clamp(23px,6.2vw,34px);font-weight:600;line-height:1.25;margin-top:0;color:#e5e3eb;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.pending{font-size:clamp(17px,4.6vw,25px);font-weight:400;margin-top:8px;color:#b9b7c1;font-variant-numeric:tabular-nums;letter-spacing:-.25px}
.meals{position:absolute;left:4%;right:4%;top:56.5%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.meal{border:0;background:transparent;backdrop-filter:none;border-radius:0;text-align:center;padding:0;min-width:0;color:white;box-shadow:none}
.meal:active{background:transparent}
.meal-name,.meal-note{display:none}
.meal-kcal{font-size:clamp(17px,4.5vw,23px);font-weight:550;line-height:1.25;margin:0;color:#e2e0e8;font-variant-numeric:tabular-nums;white-space:nowrap;text-shadow:0 1px 5px #000}
.week{position:absolute;left:7%;right:7%;top:72%;text-align:center;text-shadow:0 2px 8px #000;background:#0007;border:1px solid #ffffff25;border-radius:13px;padding:10px 8px;backdrop-filter:blur(3px)}
.week-label{font-size:clamp(11px,2.9vw,14px);color:#bcbac4;font-weight:500;letter-spacing:.7px}
.week-value{font-size:clamp(23px,6.2vw,33px);font-weight:600;color:#e5e3eb;margin-top:3px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.week-detail{font-size:10px;color:#aaa8b3;margin-top:3px}
.settings{position:absolute;top:3.5%;right:5%;border:1px solid #ffffff40;background:#0008;color:white;border-radius:50%;width:37px;height:37px;font-size:19px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}
.modal.show{display:flex}
.sheet{width:min(500px,100%);max-height:90dvh;overflow-y:auto;background:#14141a;border:1px solid #ffffff30;border-radius:20px;padding:19px 17px 24px;box-shadow:0 10px 40px #0009}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.sheet h2{font-size:20px;margin:0}
.close{width:34px;height:34px;border:0;border-radius:50%;background:#333;color:white;font-size:20px}
.field{display:block;color:#bbb;font-size:13px;margin:12px 0}
.field input,.field select{display:block;width:100%;margin-top:7px;background:#07070a;color:#fff;border:1px solid #555;border-radius:10px;padding:13px;font-size:20px}
.save{width:100%;margin-top:10px;padding:14px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-size:16px;font-weight:750}
.row{display:flex;gap:10px}.row .field{flex:1;min-width:0}
@media(max-height:700px){.top{top:5%}.total{margin-top:6px}.meals{top:51%}.meal{padding:5px 2px}.week{top:70%;padding:7px}}
</style>
</head>
<body>
<main class="app">
 <section class="top">
  
  <div class="view-date" id="viewDateLabel"></div>
  <div class="total" id="dailyTotal">0 kcal · 0%</div>
  <div class="pending" id="dailyPending">Pendiente: 2.500 kcal</div>
 </section>
 <button class="settings" id="settingsOpen" aria-label="Configurar presupuestos">⚙</button>
 <section class="meals">
  <button class="meal" data-meal="breakfast" aria-label="Editar calorías"><div class="meal-kcal" id="breakfastKcal">0 kcal</div></button>
  <button class="meal" data-meal="lunch" aria-label="Editar calorías"><div class="meal-kcal" id="lunchKcal">0 kcal</div></button>
  <button class="meal" data-meal="dinner" aria-label="Editar calorías"><div class="meal-kcal" id="dinnerKcal">0 kcal</div></button>
 </section>
 <section class="week">
  <div class="week-label">PENDIENTE DE LA SEMANA</div>
  <div class="week-value" id="weeklyPending">17.500 kcal</div>
  <div class="week-detail" id="weeklyDetail">0 kcal consumidas de 17.500 kcal</div>
 </section>
</main>
<div class="modal" id="entryModal"><div class="sheet">
 <div class="sheet-head"><h2 id="entryTitle">Registrar desayuno</h2><button class="close" data-close="entryModal">×</button></div>
 <label class="field">Calorías de esta comida<input id="caloriesInput" type="number" min="0" inputmode="numeric" placeholder="Introduce las kcal"></label>
 <button class="save" id="entrySave">Guardar</button>
</div></div>
<div class="modal" id="settingsModal"><div class="sheet">
 <div class="sheet-head"><h2>Configuración y registro por fecha</h2><button class="close" data-close="settingsModal">×</button></div>
 <div class="row">
  <label class="field">Presupuesto diario (kcal)<input id="dailyBudget" type="number" min="1" step="50"></label>
  <label class="field">Presupuesto semanal (kcal)<input id="weeklyBudget" type="number" min="1" step="100"></label>
 </div>
 <label class="field">Día que quieres consultar o editar<input id="settingsDate" type="date"></label>
 <div class="row">
  <label class="field">Desayuno (kcal)<input id="settingsBreakfast" type="number" min="0" step="1" inputmode="numeric"></label>
  <label class="field">Almuerzo (kcal)<input id="settingsLunch" type="number" min="0" step="1" inputmode="numeric"></label>
  <label class="field">Cena (kcal)<input id="settingsDinner" type="number" min="0" step="1" inputmode="numeric"></label>
 </div>
 <button class="save" id="settingsSave">Guardar presupuestos y comidas de este día</button>
</div></div>
<script>
const STORE='fletcherize_meal_overlay_v1',DEFAULT={daily:2500,weekly:17500,days:{}};
let data;try{data={...DEFAULT,...JSON.parse(localStorage.getItem(STORE))}}catch{data={...DEFAULT}}data.days=data.days||{};
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('es-ES');
const today=new Date();today.setHours(12,0,0,0);
let activeDate=new Date(today),activeMeal='breakfast';
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate=v=>{let [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,12)};
const dayData=k=>data.days[k]||{breakfast:0,lunch:0,dinner:0};
const sum=d=>(+d.breakfast||0)+(+d.lunch||0)+(+d.dinner||0);
const weekKeys=()=>{let start=new Date(activeDate);start.setHours(12,0,0,0);start.setDate(start.getDate()-(start.getDay()+6)%7);return Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return key(d)})};
function persist(){localStorage.setItem(STORE,JSON.stringify(data))}
function render(){
 let k=key(activeDate),d=dayData(k),used=sum(d),left=data.daily-used,pct=Math.round(used/data.daily*100);
 $('viewDateLabel').textContent=activeDate.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $('dailyTotal').textContent=`${fmt(used)} kcal · ${Math.max(0,pct)}%`;
 $('dailyPending').textContent=`Pendiente: ${fmt(left)} kcal`;
 $('dailyPending').style.color=left<0?'var(--red)':'#b9b7c1';
 ['breakfast','lunch','dinner'].forEach(m=>$(m+'Kcal').textContent=fmt(d[m]||0)+' kcal');
 let weeklyUsed=weekKeys().reduce((n,k)=>n+sum(dayData(k)),0),weeklyLeft=data.weekly-weeklyUsed;
 $('weeklyPending').textContent=fmt(weeklyLeft)+' kcal';
 $('weeklyPending').style.color=weeklyLeft<0?'var(--red)':'#e5e3eb';
 $('weeklyDetail').textContent=`${fmt(weeklyUsed)} kcal consumidas de ${fmt(data.weekly)} kcal`;
}
function open(id){$(id).classList.add('show')}function close(id){$(id).classList.remove('show')}
function populateSettingsDate(){
 const k=$('settingsDate').value||key(activeDate),d=dayData(k);
 $('settingsBreakfast').value=d.breakfast||0;
 $('settingsLunch').value=d.lunch||0;
 $('settingsDinner').value=d.dinner||0;
}
document.querySelectorAll('[data-meal]').forEach(b=>b.onclick=()=>{
 activeMeal=b.dataset.meal;
 let names={breakfast:'Desayuno',lunch:'Almuerzo',dinner:'Cena'};
 $('entryTitle').textContent='Registrar '+names[activeMeal].toLowerCase();
 $('caloriesInput').value=dayData(key(activeDate))[activeMeal]||'';
 open('entryModal')
});
$('entrySave').onclick=()=>{
 let v=Math.max(0,+$('caloriesInput').value||0),k=key(activeDate);
 if(!data.days[k])data.days[k]={breakfast:0,lunch:0,dinner:0};
 data.days[k][activeMeal]=v;persist();close('entryModal');render()
};
$('settingsOpen').onclick=()=>{
 $('dailyBudget').value=data.daily;
 $('weeklyBudget').value=data.weekly;
 $('settingsDate').value=key(activeDate);
 populateSettingsDate();
 open('settingsModal')
};
$('settingsDate').onchange=populateSettingsDate;
$('settingsSave').onclick=()=>{
 let d=+$('dailyBudget').value,w=+$('weeklyBudget').value,dateValue=$('settingsDate').value;
 if(!(d>0&&w>0&&dateValue))return;
 data.daily=d;data.weekly=w;
 let k=dateValue;
 data.days[k]={
  breakfast:Math.max(0,+$('settingsBreakfast').value||0),
  lunch:Math.max(0,+$('settingsLunch').value||0),
  dinner:Math.max(0,+$('settingsDinner').value||0)
 };
 activeDate=parseDate(dateValue);
 persist();close('settingsModal');render()
};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));
render();
</script>
</body>
